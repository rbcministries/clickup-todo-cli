name: Release

# How we release: a maintainer creates the GitHub Release from the repo's **Releases UI**
# — new tag, "Generate release notes", and "Set as a pre-release" for a beta. Publishing it
# fires this workflow, which builds the artifacts and ATTACHES them to that existing Release.
# (The Release and its notes already exist by the time this runs — it just has no binaries yet.)
#
# The version is derived from the release tag (leading "v" stripped) and injected into both the
# self-contained binaries and the packed .NET global tool, so the csproj <Version> never has to
# be hand-bumped per release. Whether a release is a pre-release is decided in the UI, not here.
#
# Note: `release` events only trigger from the workflow file on the **default branch**, so this
# takes effect once merged to `main`.

on:
  release:
    types: [published]

permissions:
  contents: write # required to upload assets to the Release

jobs:
  # Gate: never attach artifacts built from a red build.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore clickup-todo.slnx
      - run: dotnet build clickup-todo.slnx --configuration Release --no-restore
      # ClickUp integration tests self-skip without CLICKUP_TOKEN.
      - run: dotnet test clickup-todo.slnx --configuration Release --no-build

  # Build one self-contained, single-file executable per target runtime, each on
  # its native OS so ReadyToRun (ahead-of-time) compilation is valid.
  build:
    needs: test
    strategy:
      fail-fast: true # don't ship a release missing a platform
      matrix:
        # Betas ship win-x64 only: it's the primary (Windows) audience and the best-tested target.
        # The non-Windows RIDs below stay commented out until epic #312 clears — the token now
        # goes to the OS secret store on every platform (#306), but Gatekeeper/exec-bit packaging
        # (#310), non-Windows terminal rendering & keybindings (#309), and a clean-machine smoke
        # test (#311) are still open. Uncomment them once those are resolved or accepted as
        # non-blocking. (Each runs on its native OS so PublishReadyToRun stays valid.)
        # Contributors run any OS via `dotnet run` regardless.
        include:
          - rid: win-x64
            os: windows-latest
            ext: ".exe"
          # - rid: linux-x64
          #   os: ubuntu-latest
          #   ext: ""
          # - rid: osx-arm64
          #   os: macos-latest
          #   ext: ""
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash # bash is present on the Windows runner too — one script for all OSes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version from the release tag
        id: v
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Publish self-contained single file
        run: |
          dotnet publish src/ClickUpTodo/ClickUpTodo.csproj \
            --configuration Release \
            --runtime ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:PublishReadyToRun=true \
            -p:Version=${{ steps.v.outputs.version }} \
            --output "publish/${{ matrix.rid }}"

      - name: Stage the versioned binary
        run: |
          mkdir -p dist
          cp "publish/${{ matrix.rid }}/clickup-todo${{ matrix.ext }}" \
             "dist/clickup-todo-${{ steps.v.outputs.version }}-${{ matrix.rid }}${{ matrix.ext }}"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error

  # Pack the framework-dependent global tool, gather every binary, and attach them
  # to the Release that triggered this run.
  release:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compute version from the release tag
        id: v
        run: |
          TAG="${{ github.event.release.tag_name }}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Pack the .NET global tool
        run: |
          dotnet pack src/ClickUpTodo/ClickUpTodo.csproj \
            --configuration Release \
            -p:Version=${{ steps.v.outputs.version }} \
            --output dist

      - name: Download platform binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: binary-*
          merge-multiple: true

      - name: Collect all release assets
        run: |
          cp artifacts/* dist/
          echo "Release assets:"
          ls -la dist

      - name: Attach assets to the existing Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
